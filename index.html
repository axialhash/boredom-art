<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ax is bored</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #050505; overflow: hidden; touch-action: none; }
  canvas { display: block; }
  #msg {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    font-family: 'Courier New', monospace; font-size: 10px;
    color: rgba(255,255,255,0.2); letter-spacing: 0.12em;
    pointer-events: none; user-select: none;
    white-space: nowrap;
  }
</style>
</head>
<body>
<div id="msg">ax is bored — touch anywhere</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
<script>
let t = 0;
let tx = 0, ty = 0;
let targetX, targetY;
let trails = [];
const MAX = 60;
let autoMode = true;

function setup() {
  createCanvas(windowWidth, windowHeight);
  colorMode(HSB, 360, 100, 100, 100);
  background(0);
  targetX = width / 2;
  targetY = height / 2;
  tx = targetX;
  ty = targetY;
}

function draw() {
  noStroke();
  fill(0, 0, 0, 6);
  rect(0, 0, width, height);

  // auto-animate when idle
  if (autoMode) {
    targetX = width/2 + cos(t * 0.012) * width * 0.3 + sin(t * 0.008) * width * 0.1;
    targetY = height/2 + sin(t * 0.015) * height * 0.25 + cos(t * 0.01) * height * 0.1;
  }

  tx = lerp(tx, targetX, 0.06);
  ty = lerp(ty, targetY, 0.06);

  trails.push({ x: tx, y: ty, t: t });
  if (trails.length > MAX) trails.shift();

  // organic blob trail
  noFill();
  for (let i = 1; i < trails.length; i++) {
    let p = trails[i];
    let prev = trails[i-1];
    let alpha = (i / trails.length) * 50;
    let hue = (t * 2 + i * 7) % 360;
    let size = map(i, 0, trails.length, 3, 35);

    stroke(hue, 75, 100, alpha);
    strokeWeight(size * 0.5);

    let wx = sin(t * 0.025 + i * 0.35) * size * 0.6;
    let wy = cos(t * 0.02 + i * 0.4) * size * 0.6;

    beginShape();
    curveVertex(prev.x + wx, prev.y + wy);
    curveVertex(prev.x, prev.y);
    curveVertex(p.x, p.y);
    curveVertex(p.x - wx, p.y - wy);
    endShape();
  }

  // floating particles
  for (let i = 0; i < 2; i++) {
    let angle = random(TWO_PI);
    let r = random(10, 50);
    let px = tx + cos(angle) * r;
    let py = ty + sin(angle) * r;
    let hue2 = (t * 3 + random(120)) % 360;
    noStroke();
    fill(hue2, 60, 100, random(15, 40));
    ellipse(px, py, random(1, 5));
  }

  // breathing rings
  let ringSize = 40 + sin(t * 0.025) * 25;
  let ringHue = (t * 1.2) % 360;
  noFill();
  for (let r = 0; r < 3; r++) {
    stroke(ringHue, 50, 100, 12 - r * 3);
    strokeWeight(1);
    ellipse(width/2, height/2, ringSize * (1 + r * 0.6));
  }

  t++;
}

function touchMoved() {
  autoMode = false;
  targetX = mouseX;
  targetY = mouseY;
  return false;
}

function touchEnded() {
  // resume auto after 3 seconds of no touch
  setTimeout(() => { autoMode = true; }, 3000);
}

function mouseMoved() {
  autoMode = false;
  targetX = mouseX;
  targetY = mouseY;
  setTimeout(() => { autoMode = true; }, 3000);
}

function mousePressed() {
  autoMode = false;
  targetX = mouseX;
  targetY = mouseY;
  background(0);
  trails = [];
  setTimeout(() => { autoMode = true; }, 3000);
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
}
</script>
</body>
</html>
