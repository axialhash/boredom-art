<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ax is bored</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #050505; overflow: hidden; cursor: crosshair; }
  canvas { display: block; }
  #msg {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    font-family: 'Courier New', monospace; font-size: 11px;
    color: rgba(255,255,255,0.25); letter-spacing: 0.15em;
    pointer-events: none; user-select: none;
  }
</style>
</head>
<body>
<div id="msg">AX IS BORED — MOVE YOUR MOUSE</div>
<script>
let t = 0;
let mx = 0, my = 0;
let trails = [];
const MAX = 80;

function setup() {
  createCanvas(windowWidth, windowHeight);
  colorMode(HSB, 360, 100, 100, 100);
  background(0);
  // seed with some initial art so it's not black on load
  for (let i = 0; i < 200; i++) {
    let angle = random(TWO_PI);
    let r = random(50, min(width, height) * 0.4);
    let x = width/2 + cos(angle) * r;
    let y = height/2 + sin(angle) * r;
    let hue = random(360);
    noStroke();
    fill(hue, 80, 100, random(10, 40));
    ellipse(x, y, random(2, 20));
  }
  // spiral arms
  for (let arm = 0; arm < 5; arm++) {
    let baseAngle = arm * TWO_PI / 5;
    for (let i = 0; i < 60; i++) {
      let a = baseAngle + i * 0.12;
      let r = i * 3.5;
      let x = width/2 + cos(a) * r;
      let y = height/2 + sin(a) * r;
      let hue = (arm * 72 + i * 4) % 360;
      noStroke();
      fill(hue, 70, 100, map(i, 0, 60, 50, 5));
      ellipse(x, y, map(i, 0, 60, 1, 8));
    }
  }
}

function draw() {
  // fade background slowly
  noStroke();
  fill(0, 0, 0, 4);
  rect(0, 0, width, height);

  mx = lerp(mx, mouseX, 0.08);
  my = lerp(my, mouseY, 0.08);

  trails.push({ x: mx, y: my, t: t, life: 1 });
  if (trails.length > MAX) trails.shift();

  // draw organic blob trail
  noFill();
  for (let i = 1; i < trails.length; i++) {
    let p = trails[i];
    let prev = trails[i-1];
    let alpha = (i / trails.length) * 60;
    let hue = (t * 2 + i * 8) % 360;
    let size = map(i, 0, trails.length, 2, 40);

    stroke(hue, 80, 100, alpha);
    strokeWeight(size * 0.6);

    // organic wobble
    let wobbleX = sin(t * 0.02 + i * 0.3) * size * 0.5;
    let wobbleY = cos(t * 0.015 + i * 0.4) * size * 0.5;

    beginShape();
    curveVertex(prev.x + wobbleX, prev.y + wobbleY);
    curveVertex(prev.x, prev.y);
    curveVertex(p.x, p.y);
    curveVertex(p.x - wobbleX, p.y - wobbleY);
    endShape();
  }

  // particles at cursor
  for (let i = 0; i < 3; i++) {
    let angle = random(TWO_PI);
    let radius = random(5, 30);
    let px = mx + cos(angle) * radius;
    let py = my + sin(angle) * radius;
    let hue2 = (t * 3 + random(100)) % 360;
    noStroke();
    fill(hue2, 70, 100, random(20, 50));
    ellipse(px, py, random(1, 4));
  }

  // center breathing ring
  let ringSize = 50 + sin(t * 0.03) * 30;
  let ringHue = (t * 1.5) % 360;
  noFill();
  stroke(ringHue, 60, 100, 15);
  strokeWeight(1);
  ellipse(width/2, height/2, ringSize, ringSize);
  stroke(ringHue, 60, 100, 8);
  ellipse(width/2, height/2, ringSize * 1.5, ringSize * 1.5);
  stroke(ringHue, 60, 100, 4);
  ellipse(width/2, height/2, ringSize * 2.2, ringSize * 2.2);

  t++;
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
}

function mousePressed() {
  background(0);
  trails = [];
}

function keyPressed() {
  if (key === ' ') background(0);
}
</script>
</body>
</html>
